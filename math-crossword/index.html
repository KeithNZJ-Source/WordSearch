const MODES=['progressive','easy','medium','hard','advanced'];

function solve(eqs,values,holes){const known={...values};for(const k of holes)delete known[k];let change=true;while(change){change=false;for(const e of eqs){const k=[e.a,e.m,e.b],v=k.map(x=>known[x]),missing=v.map((x,i)=>x===undefined?i:-1).filter(i=>i>=0);if(missing.length===1){const i=missing[0],x=infer(e.op,v,i);if(Number.isInteger(x)&&x>=0){known[k[i]]=x;change=true}}}}return holes.every(k=>known[k]===values[k])}


function advancedSettings(index){const edges=Math.min(20,8+Math.floor(index/10));return {size:index<40?13:17,limit:Math.min(999,100+Math.floor(index/5)*20),factor:Math.min(20,8+Math.floor(index/10)),edges,holes:edges,cycles:Math.min(5,Math.floor((edges-8)/2)),depth:edges<12?2:edges<16?3:4}}
function advancedLayout(conf,R){const N=STRIDE,S=conf.size,count=conf.edges,candidates=[];for(let r=0;r<S;r++)for(let c=0;c<S;c++)for(const dir of [1,N]){if(dir===1?c+4>=S:r+4>=S)continue;const a=r*N+c,cells=Array.from({length:5},(_,i)=>a+i*dir);candidates.push({a,m:cells[2],b:cells[4],dir,cells})}

function deductionDepth(eqs,values,holes){const known={...values};for(const k of holes)delete known[k];let rounds=0;while(true){const updates={};for(const e of eqs){const keys=[e.a,e.m,e.b],v=keys.map(k=>known[k]),missing=v.map((x,i)=>x===undefined?i:-1).filter(i=>i>=0);if(missing.length===1){const i=missing[0],x=infer(e.op,v,i);if(Number.isInteger(x)&&x===values[keys[i]])updates[keys[i]]=x}}if(!Object.keys(updates).length)break;Object.assign(known,updates);rounds++}return holes.every(k=>known[k]===values[k])?rounds:0}
function advancedTriples(op,known,conf,R){const out=[],[a,b,c]=known,limit=conf.limit,f=conf.factor;

try{const s=JSON.parse(localStorage.getItem('mathCrosswordV2')||'{}');if(MODES.includes(s.mode))mode=s.mode;for(const m of MODES)if(Number.isSafeInteger(s.indices?.[m])&&s.indices[m]>=0)indices[m]=s.indices[m]}catch(e){}

bank.replaceChildren();const used=new Set(Object.values(placed));for(const t of puzzle.tiles){if(used.has(t.id)){const slot=document.createElement('div');slot.className='tile-slot';slot.setAttribute('aria-hidden','true');slot.textContent='·';bank.append(slot);continue}const b=document.createElement('button');b.type='button';b.className='tile'+(selected===t.id?' selected':'');b.textContent=t.value;b.dataset.tile=t.id;b.setAttribute('aria-label','Number '+t.value);b.setAttribute('aria-pressed',String(selected===t.id));b.onclick=e=>{if(e.detail===0){selected=selected===t.id?null:t.id;render()}};b.addEventListener('pointerdown',startDrag);bank.append(b)}

function startDrag(e){if(drag||e.button!==0)return;e.preventDefault();const b=e.currentTarget,id=Number(b.dataset.tile);drag={id,pointer:e.pointerId,x:e.clientX,y:e.clientY,moved:false,ghost:null,element:b};b.setPointerCapture(e.pointerId);b.addEventListener('pointermove',moveDrag);b.addEventListener('pointerup',endDrag);b.addEventListener('pointercancel',cancelDrag)}

function load(){puzzle=make(mode,indices[mode]);$('mode').value=mode;$('puzzle-title').textContent=(mode==='progressive'?'Level ':'Puzzle ')+(indices[mode]+1);$('meta').textContent=puzzle.eqs.length+' equations · '+[...new Set(puzzle.eqs.map(e=>e.op))].join('  ')+' · Up to '+puzzle.conf.limit+(mode==='advanced'?' · '+(puzzle.eqs.length*5-new Set(puzzle.eqs.flatMap(e=>e.cells)).size)+' crossings':'');reset();save()}
