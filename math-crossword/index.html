const MODES=['progressive','easy','medium','hard','advanced'];
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}

const STRIDE=13;
function settings(mode,index){

if(mode==='medium')return{size:9,limit:50,factor:0,edges:6,holes:6,cycles:1};

function options(op,knownA,knownC,conf,R){const max=conf.limit,f=conf.factor;let out=[];const add=(a,b,c)=>{if([a,b,c].every(v=>Number.isInteger(v)&&v>=0&&v<=max)&&(op!=='×'||(a>=1&&a<=f&&b>=1&&b<=f)))out.push([a,b,c])};if(knownA!==undefined&&knownC!==undefined){if(op==='×'){if(knownA&&knownC%knownA===0)add(knownA,knownC/knownA,knownC)}else add(knownA,op==='+'?knownC-knownA:knownA-knownC,knownC)}else if(knownA!==undefined){for(let b=0;b<=(op==='×'?f:max);b++)add(knownA,b,op==='+'?knownA+b:op==='−'?knownA-b:knownA*b)}
else if(knownC!==undefined){for(let a=0;a<=(op==='×'?f:max);a++){if(op==='×'){if(a&&knownC%a===0)add(a,knownC/a,knownC)}else add(a,op==='+'?knownC-a:a-knownC,knownC)}}
else{for(let t=0;t<160;t++){let a=1+Math.floor(R()*(op==='×'?f:max)),b=1+Math.floor(R()*(op==='×'?f:max));if(op==='−'&&b>a)[a,b]=[b,a];add(a,b,op==='+'?a+b:op==='−'?a-b:a*b)}if(!out.length)add(1,1,op==='+'?2:op==='−'?0:1)}
const preferred=out.filter(([a,b,c])=>a>0&&b>0&&c>0&&(op!=='×'||(a>1&&b>1)));return preferred.length?preferred:out}
function infer(op,v,i){const [a,b,c]=v;if(op==='÷')return i===2?(b?a/b:NaN):i===0?b*c:(c?a/c:NaN);if(i===2)return op==='+'?a+b:op==='−'?a-b:a*b;if(i===0)return op==='+'?c-b:op==='−'?c+b:b?c/b:NaN;return op==='+'?c-a:op==='−'?a-c:a?c/a:NaN}
function solve(eqs,values,holes){const known={...values};for(const k of holes)delete known[k];let change=true;while(change){change=false;for(const e of eqs){const k=[e.a,e.m,e.b],v=k.map(x=>known[x]),missing=v.map((x,i)=>x===undefined?i:-1).filter(i=>i>=0);if(missing.length===1){const i=missing[0],x=infer(e.op,v,i);if(Number.isInteger(x)&&x>=0){known[k[i]]=x;change=true}}}}return holes.every(k=>known[k]===values[k])}

function advancedSettings(index){const edges=Math.min(12,8+Math.floor(index/12));return {size:13,limit:Math.min(999,100+Math.floor(index/5)*20),factor:Math.min(20,8+Math.floor(index/10)),edges,holes:edges,cycles:0}}
function advancedLayout(count,R){const N=STRIDE,candidates=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const dir of [1,N]){if(dir===1?c+4>=N:r+4>=N)continue;const a=r*N+c,cells=Array.from({length:5},(_,i)=>a+i*dir);candidates.push({a,m:cells[2],b:cells[4],dir,cells})}

for(let retry=0;retry<50;retry++){const map=new Map(),eqs=[];function add(e){eqs.push(e);e.cells.forEach((k,i)=>{const old=map.get(k);map.set(k,{num:i%2===0,dirs:(old?.dirs||0)|(e.dir===1?1:2)})})}

if(ok&&crossings===1){const xs=[...map.keys(),...e.cells],rows=xs.map(k=>Math.floor(k/N)),cols=xs.map(k=>k%N),area=(Math.max(...rows)-Math.min(...rows)+1)*(Math.max(...cols)-Math.min(...cols)+1);options.push({e,score:-area*.04+R()*5})}}
if(!options.length)break;options.sort((a,b)=>b.score-a.score);add(pick(options.slice(0,Math.min(5,options.length)),R).e)}

return null}
function advancedTriples(op,known,conf,R){const out=[],[a,b,c]=known,limit=conf.limit,f=conf.factor;
function add(x,y,z){if(![x,y,z].every(v=>Number.isInteger(v)&&v>0&&v<=limit))return;if(op==='×'&&(x<2||y<2||x>f||y>f))return;if(op==='÷'&&(y<2||z<2||y>f||z>f))return;if((a!==undefined&&a!==x)||(b!==undefined&&b!==y)||(c!==undefined&&c!==z))return;out.push([x,y,z])}
const calc=(x,y)=>op==='+'?x+y:op==='−'?x-y:op==='×'?x*y:x/y;
if(a!==undefined&&b!==undefined)add(a,b,calc(a,b));
else if(a!==undefined&&c!==undefined)add(a,infer(op,[a,undefined,c],1),c);
else if(b!==undefined&&c!==undefined)add(infer(op,[undefined,b,c],0),b,c);
else if(a!==undefined){for(let y=1;y<=(op==='×'||op==='÷'?f:limit);y++)add(a,y,calc(a,y))}
else if(b!==undefined){if(op==='÷'){for(let z=2;z<=f;z++)add(b*z,b,z)}else for(let x=1;x<=(op==='×'?f:limit);x++)add(x,b,calc(x,b))}
else if(c!==undefined){if(op==='÷'){for(let y=2;y<=f;y++)add(y*c,y,c)}else for(let x=1;x<=(op==='×'?f:limit);x++)add(x,infer(op,[x,undefined,c],1),c)}
else{for(let j=0;j<160;j++){const bound=op==='×'||op==='÷'?f:Math.min(limit,Math.max(15,Math.floor(limit*.65)));let x=2+Math.floor(R()*(bound-1)),y=2+Math.floor(R()*(bound-1));if(op==='−'&&x<y)[x,y]=[y,x];if(op==='÷')add(x*y,y,x);else add(x,y,calc(x,y))}}

function advancedMake(index){const R=rng(Math.imul(index+1,0x9e3779b1)^0x61c88647),conf=advancedSettings(index),ops=['+','−','×','÷'];
for(let outer=0;outer<12;outer++){const edges=advancedLayout(conf.edges,R);if(!edges)continue;for(let attempt=0;attempt<60;attempt++){const values={},eqs=[],counts=Object.fromEntries(ops.map(o=>[o,0]));let good=true;
for(const e of edges){const known=[values[e.a],values[e.m],values[e.b]],order=shuffle(ops,R).sort((a,b)=>counts[a]-counts[b]);let chosen;for(const op of order){const triples=advancedTriples(op,known,conf,R);if(!triples.length)continue;const score=t=>t.reduce((s,v)=>s+(v>=2&&v<=conf.factor?1:0),0);const best=triples.filter(t=>score(t)>=1);const use=best.length&&R()<.60?best:triples;chosen={op,v:pick(use,R)};break}if(!chosen){good=false;break}const [a,b,c]=chosen.v;values[e.a]=a;values[e.m]=b;values[e.b]=c;counts[chosen.op]++;eqs.push({...e,op:chosen.op})}

const degree=k=>eqs.filter(e=>[e.a,e.m,e.b].includes(k)).length;

function make(mode,index){if(mode==='advanced')return advancedMake(index);const R=rng(Math.imul(index+1,0x9e3779b1)^Math.imul(MODES.indexOf(mode)+1,0x85ebca6b)),conf=settings(mode,index),allowed=conf.factor?['+','−','×']:['+','−'];

const $=id=>document.getElementById(id),grid=$('grid'),bank=$('bank');let mode='progressive',indices=Object.fromEntries(MODES.map(m=>[m,0])),puzzle,placed={},selected=null,checked=false,drag=null;
try{const s=JSON.parse(localStorage.getItem('mathCrosswordV2')||'{}');if(MODES.includes(s.mode))mode=s.mode;for(const m of MODES)if(Number.isSafeInteger(s.indices?.[m])&&s.indices[m]>=0)indices[m]=s.indices[m]}catch(e){}

function say(t='',error=false){$('status').textContent=t;$('status').classList.toggle('error',error)}
function valueOf(id){return puzzle.tiles.find(t=>t.id===id)?.value}
function filled(k){return Object.prototype.hasOwnProperty.call(placed,k)}
function valueAt(k){return puzzle.holes.includes(k)?filled(k)?valueOf(placed[k]):undefined:puzzle.values[k]}
function allCorrect(){return puzzle.holes.every(k=>filled(k))&&puzzle.eqs.every(e=>infer(e.op,[valueAt(e.a),valueAt(e.m),undefined],2)===valueAt(e.b))}
function render(){const symbols={};for(const e of puzzle.eqs){symbols[(e.a+e.m)/2]=e.op;symbols[(e.m+e.b)/2]='='}const active=new Set([...Object.keys(puzzle.values),...Object.keys(symbols)].map(Number));const rows=[...active].map(k=>Math.floor(k/STRIDE)),cols=[...active].map(k=>k%STRIDE),r0=Math.min(...rows),r1=Math.max(...rows),c0=Math.min(...cols),c1=Math.max(...cols);grid.style.setProperty('--cols',String(c1-c0+1));grid.classList.toggle('advanced-grid',mode==='advanced');grid.replaceChildren();for(let row=r0;row<=r1;row++)for(let col=c0;col<=c1;col++){const k=row*STRIDE+col;const hole=puzzle.holes.includes(k),has=Object.prototype.hasOwnProperty.call(puzzle.values,k);const el=document.createElement(hole?'button':'div');el.className='square';if(active.has(k)){if(col>c0&&active.has(k-1))el.classList.add('join-left');if(row>r0&&active.has(k-STRIDE))el.classList.add('join-top')}else el.classList.add('empty-space');if(hole){el.type='button';el.dataset.k=k;el.classList.add('blank');if(filled(k)){el.textContent=valueOf(placed[k]);el.classList.add('filled');if(checked)el.classList.add(valueOf(placed[k])===puzzle.values[k]?'correct':'wrong')}else if(selected!==null)el.classList.add('ready');el.setAttribute('aria-label','Answer box row '+(row-r0+1)+', column '+(col-c0+1)+(filled(k)?', '+el.textContent:', empty'));el.onclick=()=>{if(selected!==null)put(selected,k);else if(filled(k)){delete placed[k];checked=false;say();render()}}}else if(has){el.classList.add('given');el.textContent=puzzle.values[k]}else if(symbols[k]){el.classList.add('symbol');el.textContent=symbols[k]}else{el.setAttribute('aria-hidden','true')}grid.append(el)}
bank.replaceChildren();const used=new Set(Object.values(placed));for(const t of puzzle.tiles){if(used.has(t.id))continue;const b=document.createElement('button');b.type='button';b.className='tile'+(selected===t.id?' selected':'');b.textContent=t.value;b.dataset.tile=t.id;b.setAttribute('aria-label','Number '+t.value);b.setAttribute('aria-pressed',String(selected===t.id));b.onclick=e=>{if(e.detail===0){selected=selected===t.id?null:t.id;render()}};b.addEventListener('pointerdown',startDrag);bank.append(b)}
if(!bank.children.length){const t=document.createElement('span');t.className='hint';t.textContent='All numbers placed';bank.append(t)}$('progress').textContent=Object.keys(placed).length+' of '+puzzle.holes.length+' boxes filled';$('next').hidden=!allCorrect()}
function put(id,k){if(!puzzle.holes.includes(k)||Object.values(placed).includes(id))return;placed[k]=id;selected=null;checked=false;say();if(allCorrect()){checked=true;say('Well done! All equations are correct.')}render()}
function startDrag(e){if(drag||e.button!==0)return;e.preventDefault();const b=e.currentTarget,id=Number(b.dataset.tile);drag={id,pointer:e.pointerId,x:e.clientX,y:e.clientY,moved:false,ghost:null,element:b};b.setPointerCapture(e.pointerId);b.addEventListener('pointermove',moveDrag);b.addEventListener('pointerup',endDrag);b.addEventListener('pointercancel',cancelDrag)}
function moveDrag(e){if(!drag||drag.pointer!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7){drag.moved=true;const ghost=document.createElement('div');ghost.className='tile ghost';ghost.textContent=valueOf(drag.id);document.body.append(ghost);drag.ghost=ghost}if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}}
function clearDrag(){if(!drag)return;const d=drag;drag=null;d.ghost?.remove();d.element.removeEventListener('pointermove',moveDrag);d.element.removeEventListener('pointerup',endDrag);d.element.removeEventListener('pointercancel',cancelDrag);return d}
function cancelDrag(){clearDrag()}
function endDrag(e){if(!drag||drag.pointer!==e.pointerId)return;const d=clearDrag(),target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-k]');if(d.moved){if(target)put(d.id,Number(target.dataset.k));else{selected=null;render()}}else{selected=selected===d.id?null:d.id;render()}}
function reset(){clearDrag();placed={};selected=null;checked=false;say();render()}
function load(){puzzle=make(mode,indices[mode]);$('mode').value=mode;$('meta').textContent=(mode==='progressive'?'Level ':'Puzzle ')+(indices[mode]+1)+' · '+puzzle.eqs.length+' equations · numbers up to '+puzzle.conf.limit+(puzzle.conf.factor?' · multiplication up to '+puzzle.conf.factor+' × '+puzzle.conf.factor:'');reset();save()}
function next(){indices[mode]++;load()}
$('mode').onchange=()=>{mode=$('mode').value;load()};$('reset').onclick=reset;$('new').onclick=next;$('next').onclick=next;$('check').onclick=()=>{checked=true;if(allCorrect())say('Well done! All equations are correct.');else if(puzzle.holes.some(k=>filled(k)&&valueAt(k)!==puzzle.values[k]))say('Some numbers need another try. Tap a filled box to change it.',true);else say('Good work. Fill the remaining boxes.');render()};load();
</script></body></html>
