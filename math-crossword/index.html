<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Maths Crossword</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#1c3148;font-family:system-ui,-apple-system,sans-serif;font-weight:600}main{max-width:820px;margin:auto;padding:16px 12px 32px;text-align:center}h1{font-size:clamp(25px,5vw,36px);margin:4px 0}p{margin:8px 0;line-height:1.4}button,select{font:inherit;color:inherit;border:0;border-radius:12px;min-height:44px;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #1767b5;outline-offset:2px}.settings{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:15px auto}.settings select{background:white;border:1px solid #b8c8d9;padding:7px 12px}.meta{color:#48627d;font-size:14px}.grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;width:min(100%,580px);margin:14px auto;user-select:none;-webkit-user-select:none}.square{aspect-ratio:1;display:flex;align-items:center;justify-content:center;min-width:0;font-size:clamp(14px,4vw,29px);font-variant-numeric:tabular-nums}.given{background:#e1eaf4;border:1px solid #b1c6db;border-radius:8px;color:#18334e}.symbol{color:#445e77;font-size:clamp(19px,5vw,34px)}.blank{background:white;border:2px dashed #7b98b8;border-radius:8px;min-height:0;padding:0;width:100%;font-size:inherit}.blank.filled{background:#d4e9ff;border:2px solid #4c83bd}.blank.ready{border-color:#1767b5;background:#eef7ff}.blank.correct{background:#d5f0dd;border:2px solid #3e8856}.blank.wrong{background:#ffeded;border:2px solid #c76c6c}.bank{min-height:68px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:9px;margin:10px auto 16px}.tile{min-width:57px;min-height:54px;padding:8px 12px;background:#d8e8fc;border:2px solid #7da8d5;color:#193e6b;box-shadow:0 3px 0 #9dbadd;touch-action:none;user-select:none;-webkit-user-select:none;font-size:clamp(20px,5vw,28px);font-variant-numeric:tabular-nums}.tile.selected{outline:3px solid #1767b5;outline-offset:2px}.ghost{position:fixed;pointer-events:none;z-index:100;transform:translate(-50%,-50%);opacity:.9}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.actions button{padding:10px 15px;background:#dce6f2}.actions .primary{background:#225b9c;color:white}.actions .next{background:#267647;color:white}.actions button[hidden]{display:none}.status{min-height:48px;font-size:17px;color:#286444;margin:8px auto}.status.error{color:#993b3b}h2{font-size:21px;margin:12px 0 4px}.hint{font-size:14px;color:#546c84}.legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:13px;color:#546c84}.swatch{display:inline-block;width:13px;height:13px;margin-right:5px;vertical-align:-1px;border-radius:3px;background:#e1eaf4;border:1px solid #b1c6db}.swatch.empty{background:white;border:1px dashed #7b98b8}@media(max-width:380px){.grid{gap:2px}.square{font-size:13px}.symbol{font-size:19px}.given,.blank{border-radius:5px}.tile{min-width:50px}}

/* Print-style connected maths crossword: every visible cell, including operators, is boxed. */
.grid{grid-template-columns:repeat(var(--cols,9),minmax(0,1fr));gap:0;width:min(100%,calc(var(--cols,9) * 64px));margin:20px auto}
.square{border-radius:0;font-size:clamp(15px,4.6vw,27px);font-weight:700}
.square.given,.square.symbol,.square.blank{border:1px solid #344960;border-radius:0;box-shadow:none}
.square.join-left{border-left-width:0}
.square.join-top{border-top-width:0}
.square.given{background:#edf2f7;color:#172d45}
.square.symbol{background:#edf2f7;color:#172d45;font-size:clamp(20px,5vw,31px)}
.square.blank{background:#fffef2;position:relative}
.square.blank:not(.filled)::after{content:'';display:block;width:52%;height:0;border-bottom:2px solid #a6b5c6;position:absolute;bottom:19%;left:24%}
.square.blank.ready{background:#dceeff}
.square.blank.filled{background:#d8e9ff}
.square.blank.correct{background:#d5f0dd}
.square.blank.wrong{background:#ffe0e0}
.square.blank:focus-visible{z-index:1;outline:3px solid #1767b5;outline-offset:-3px}
.square.empty-space{background:transparent;border:0;pointer-events:none}
.swatch.empty{background:#fffef2;border:1px solid #344960}
.swatch{border-radius:0;background:#edf2f7;border:1px solid #344960}
@media(max-width:380px){.grid{gap:0}.square{font-size:clamp(12px,4.2vw,17px)}.square.symbol{font-size:21px}}
</style></head><body><main><h1>Maths Crossword</h1><p>Complete the equations across and down.</p><div class="settings"><label for="mode">Difficulty</label><select id="mode"><option value="easy">Easy · + and −</option><option value="medium">Medium · + and −</option><option value="hard">Hard · + and −</option><option value="advanced">Advanced · +, − and ×</option></select></div><p id="meta" class="meta"></p><p id="progress" aria-live="polite"></p><div id="grid" class="grid" aria-label="Maths crossword"></div><div class="legend"><span><i class="swatch"></i>Prefilled number or sign</span><span><i class="swatch empty"></i>Fill this box</span></div><h2>Number bank</h2><p class="hint">Drag a number into a box, or tap the number and then the box. Tap a filled box to return its number.</p><div id="bank" class="bank" aria-label="Number bank"></div><div class="actions"><button id="reset">Reset</button><button id="check" class="primary">Check answers</button><button id="new">New Puzzle</button><button id="next" class="next" hidden>Next Puzzle →</button></div><p id="status" class="status" aria-live="polite"></p></main><script>

const MODES=['easy','medium','hard','advanced'];
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function shuffle(a,R){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick=(a,R)=>a[Math.floor(R()*a.length)];
function settings(mode,index){if(mode==='easy')return{limit:20,factor:0,edges:3,holes:3};if(mode==='medium')return{limit:50,factor:0,edges:4,holes:4};if(mode==='hard')return{limit:100,factor:0,edges:5,holes:5};return{limit:Math.min(999,100+Math.floor(index/5)*25),factor:Math.min(20,6+Math.floor(index/12)),edges:6,holes:6}}
const key=(r,c)=>r*9+c;
function topology(count,R){const all=[];for(let r=0;r<9;r+=4)for(let c=0;c<9;c+=4){if(c<8)all.push({a:key(r,c),m:key(r,c+2),b:key(r,c+4),line:'h'+r});if(r<8)all.push({a:key(r,c),m:key(r+2,c),b:key(r+4,c),line:'v'+c})}
for(let t=0;t<40;t++){const first=pick(all,R),result=[first],nodes=new Set([first.a,first.b]),lines=new Set([first.line]);while(result.length<count){const possible=all.filter(e=>!lines.has(e.line)&&nodes.has(e.a)!==nodes.has(e.b));if(!possible.length)break;const e=pick(possible,R);result.push(e);nodes.add(e.a);nodes.add(e.b);lines.add(e.line)}if(result.length===count)return result}
const fallback=[[0,0,0,4],[0,4,4,4],[4,4,4,8],[4,8,8,8],[8,4,8,8],[0,0,4,0]];return fallback.slice(0,count).map(([r,c,s,d])=>({a:key(r,c),m:key((r+s)/2,(c+d)/2),b:key(s,d),line:r===s?'h'+r:'v'+c}))}
function options(op,knownA,knownC,conf,R){const max=conf.limit,f=conf.factor;let out=[];const add=(a,b,c)=>{if([a,b,c].every(v=>Number.isInteger(v)&&v>=0&&v<=max)&&(op!=='×'||(a>=1&&a<=f&&b>=1&&b<=f)))out.push([a,b,c])};if(knownA!==undefined){for(let b=0;b<=(op==='×'?f:max);b++)add(knownA,b,op==='+'?knownA+b:op==='−'?knownA-b:knownA*b)}
else if(knownC!==undefined){for(let a=0;a<=(op==='×'?f:max);a++){if(op==='×'){if(a&&knownC%a===0)add(a,knownC/a,knownC)}else add(a,op==='+'?knownC-a:a-knownC,knownC)}}
else{for(let t=0;t<160;t++){let a=1+Math.floor(R()*(op==='×'?f:max)),b=1+Math.floor(R()*(op==='×'?f:max));if(op==='−'&&b>a)[a,b]=[b,a];add(a,b,op==='+'?a+b:op==='−'?a-b:a*b)}if(!out.length)add(1,1,op==='+'?2:op==='−'?0:1)}
const preferred=out.filter(([a,b,c])=>a>0&&b>0&&c>0&&(op!=='×'||(a>1&&b>1)));return preferred.length?preferred:out}
function infer(op,v,i){const [a,b,c]=v;if(i===2)return op==='+'?a+b:op==='−'?a-b:a*b;if(i===0)return op==='+'?c-b:op==='−'?c+b:b?c/b:NaN;return op==='+'?c-a:op==='−'?a-c:a?c/a:NaN}
function solve(eqs,values,holes){const known={...values};for(const k of holes)delete known[k];let change=true;while(change){change=false;for(const e of eqs){const k=[e.a,e.m,e.b],v=k.map(x=>known[x]),missing=v.map((x,i)=>x===undefined?i:-1).filter(i=>i>=0);if(missing.length===1){const i=missing[0],x=infer(e.op,v,i);if(Number.isInteger(x)&&x>=0){known[k[i]]=x;change=true}}}}return holes.every(k=>known[k]===values[k])}
function make(mode,index){const R=rng(Math.imul(index+1,0x9e3779b1)^Math.imul(MODES.indexOf(mode)+1,0x85ebca6b)),conf=settings(mode,index),edges=topology(conf.edges,R),values={},eqs=[];
const firstOps=mode==='advanced'?['×',...shuffle(['+','−'],R)]:shuffle(['+','−'],R);for(let i=0;i<edges.length;i++){const e=edges[i],preferred=firstOps[i]||(mode==='advanced'?pick(['+','−','×','×'],R):pick(['+','−'],R));const ops=[preferred,...shuffle((mode==='advanced'?['+','−','×']:['+','−']).filter(o=>o!==preferred),R)];let chosen;for(const op of ops){const o=options(op,values[e.a],values[e.b],conf,R);if(o.length){chosen={op,v:pick(o,R)};break}}if(!chosen)throw Error('no valid equation');const [a,b,c]=chosen.v;values[e.a]=a;values[e.m]=b;values[e.b]=c;eqs.push({...e,op:chosen.op})}
let holes=[];const keys=shuffle(Object.keys(values).map(Number),R);for(const k of keys){if(holes.length===conf.holes)break;const candidate=[...holes,k];if(solve(eqs,values,candidate))holes=candidate}
if(holes.length!==conf.holes){holes=eqs.map(e=>e.m).slice(0,conf.holes)}
const tiles=shuffle(holes.map(k=>values[k]),R).map((value,id)=>({id,value}));return{values,eqs,holes,tiles,conf}}

const $=id=>document.getElementById(id),grid=$('grid'),bank=$('bank');let mode='easy',indices=Object.fromEntries(MODES.map(m=>[m,0])),puzzle,placed={},selected=null,checked=false,drag=null;
try{const s=JSON.parse(localStorage.getItem('mathCrosswordV1')||'{}');if(MODES.includes(s.mode))mode=s.mode;for(const m of MODES)if(Number.isSafeInteger(s.indices?.[m])&&s.indices[m]>=0)indices[m]=s.indices[m]}catch(e){}
function save(){try{localStorage.setItem('mathCrosswordV1',JSON.stringify({mode,indices}))}catch(e){}}
function say(t='',error=false){$('status').textContent=t;$('status').classList.toggle('error',error)}
function valueOf(id){return puzzle.tiles.find(t=>t.id===id)?.value}
function filled(k){return Object.prototype.hasOwnProperty.call(placed,k)}
function valueAt(k){return puzzle.holes.includes(k)?filled(k)?valueOf(placed[k]):undefined:puzzle.values[k]}
function allCorrect(){return puzzle.holes.every(k=>filled(k))&&puzzle.eqs.every(e=>infer(e.op,[valueAt(e.a),valueAt(e.m),undefined],2)===valueAt(e.b))}
function render(){const symbols={};for(const e of puzzle.eqs){symbols[(e.a+e.m)/2]=e.op;symbols[(e.m+e.b)/2]='='}const active=new Set([...Object.keys(puzzle.values),...Object.keys(symbols)].map(Number));const rows=[...active].map(k=>Math.floor(k/9)),cols=[...active].map(k=>k%9),r0=Math.min(...rows),r1=Math.max(...rows),c0=Math.min(...cols),c1=Math.max(...cols);grid.style.setProperty('--cols',String(c1-c0+1));grid.replaceChildren();for(let row=r0;row<=r1;row++)for(let col=c0;col<=c1;col++){const k=row*9+col;const hole=puzzle.holes.includes(k),has=Object.prototype.hasOwnProperty.call(puzzle.values,k);const el=document.createElement(hole?'button':'div');el.className='square';if(active.has(k)){if(col>c0&&active.has(k-1))el.classList.add('join-left');if(row>r0&&active.has(k-9))el.classList.add('join-top')}else el.classList.add('empty-space');if(hole){el.type='button';el.dataset.k=k;el.classList.add('blank');if(filled(k)){el.textContent=valueOf(placed[k]);el.classList.add('filled');if(checked)el.classList.add(valueOf(placed[k])===puzzle.values[k]?'correct':'wrong')}else if(selected!==null)el.classList.add('ready');el.setAttribute('aria-label','Answer box row '+(row-r0+1)+', column '+(col-c0+1)+(filled(k)?', '+el.textContent:', empty'));el.onclick=()=>{if(selected!==null)put(selected,k);else if(filled(k)){delete placed[k];checked=false;say();render()}}}else if(has){el.classList.add('given');el.textContent=puzzle.values[k]}else if(symbols[k]){el.classList.add('symbol');el.textContent=symbols[k]}else{el.setAttribute('aria-hidden','true')}grid.append(el)}
bank.replaceChildren();const used=new Set(Object.values(placed));for(const t of puzzle.tiles){if(used.has(t.id))continue;const b=document.createElement('button');b.type='button';b.className='tile'+(selected===t.id?' selected':'');b.textContent=t.value;b.dataset.tile=t.id;b.setAttribute('aria-label','Number '+t.value);b.setAttribute('aria-pressed',String(selected===t.id));b.onclick=e=>{if(e.detail===0){selected=selected===t.id?null:t.id;render()}};b.addEventListener('pointerdown',startDrag);bank.append(b)}
if(!bank.children.length){const t=document.createElement('span');t.className='hint';t.textContent='All numbers placed';bank.append(t)}$('progress').textContent=Object.keys(placed).length+' of '+puzzle.holes.length+' boxes filled';$('next').hidden=!allCorrect()}
function put(id,k){if(!puzzle.holes.includes(k)||Object.values(placed).includes(id))return;placed[k]=id;selected=null;checked=false;say();if(allCorrect()){checked=true;say('Well done! All equations are correct.')}render()}
function startDrag(e){if(drag||e.button!==0)return;e.preventDefault();const b=e.currentTarget,id=Number(b.dataset.tile);drag={id,pointer:e.pointerId,x:e.clientX,y:e.clientY,moved:false,ghost:null,element:b};b.setPointerCapture(e.pointerId);b.addEventListener('pointermove',moveDrag);b.addEventListener('pointerup',endDrag);b.addEventListener('pointercancel',cancelDrag)}
function moveDrag(e){if(!drag||drag.pointer!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7){drag.moved=true;const ghost=document.createElement('div');ghost.className='tile ghost';ghost.textContent=valueOf(drag.id);document.body.append(ghost);drag.ghost=ghost}if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}}
function clearDrag(){if(!drag)return;const d=drag;drag=null;d.ghost?.remove();d.element.removeEventListener('pointermove',moveDrag);d.element.removeEventListener('pointerup',endDrag);d.element.removeEventListener('pointercancel',cancelDrag);return d}
function cancelDrag(){clearDrag()}
function endDrag(e){if(!drag||drag.pointer!==e.pointerId)return;const d=clearDrag(),target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-k]');if(d.moved){if(target)put(d.id,Number(target.dataset.k));else{selected=null;render()}}else{selected=selected===d.id?null:d.id;render()}}
function reset(){clearDrag();placed={};selected=null;checked=false;say();render()}
function load(){puzzle=make(mode,indices[mode]);$('mode').value=mode;$('meta').textContent='Puzzle '+(indices[mode]+1)+' · '+puzzle.eqs.length+' equations · numbers up to '+puzzle.conf.limit+(mode==='advanced'?' · multiplication up to '+puzzle.conf.factor+' × '+puzzle.conf.factor:'');reset();save()}
function next(){indices[mode]++;load()}
$('mode').onchange=()=>{mode=$('mode').value;load()};$('reset').onclick=reset;$('new').onclick=next;$('next').onclick=next;$('check').onclick=()=>{checked=true;if(allCorrect())say('Well done! All equations are correct.');else if(puzzle.holes.some(k=>filled(k)&&valueAt(k)!==puzzle.values[k]))say('Some numbers need another try. Tap a filled box to change it.',true);else say('Good work. Fill the remaining boxes.');render()};load();
</script></body></html>
